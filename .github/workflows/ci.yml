name: Remoto CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security unit tests
        run: npm run test:security

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate Postgres compose
        run: docker compose -f infra/docker/docker-compose.yml config

      - name: Validate RustDesk compose
        env:
          RUSTDESK_RELAY_HOST: 127.0.0.1
        run: docker compose -f infra/docker/docker-compose.rustdesk.yml config

      - name: Dependency audit report
        continue-on-error: true
        run: npm audit --audit-level=high
