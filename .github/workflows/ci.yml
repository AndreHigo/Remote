name: Remoto CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security unit tests
        run: npm run test:security

      - name: Agent tests
        run: npm run test -w apps/agent

      - name: Desktop control tests
        run: npm run test -w apps/desktop-control

      - name: Realtime tests
        run: npm run test -w services/realtime

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate native operator scripts
        shell: bash
        run: |
          node --check apps/operator/src/main.cjs
          node --check apps/operator/src/preload.cjs
          node --check apps/operator/src/renderer.js

      - name: Validate realtime smoke client
        run: npx --no-install tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --skipLibCheck --esModuleInterop scripts/smoke-realtime-client.ts

      - name: Validate Postgres compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password-123456789
        run: docker compose -f infra/docker/docker-compose.yml config

      - name: Validate RustDesk compose
        env:
          RUSTDESK_RELAY_HOST: 127.0.0.1
        run: docker compose -f infra/docker/docker-compose.rustdesk.yml config

      - name: Validate production compose
        env:
          WEB_DOMAIN: remoto.test.example
          ACME_EMAIL: ci@example.com
          POSTGRES_DB: remoto
          POSTGRES_USER: remoto
          POSTGRES_PASSWORD: ci-postgres-password-123456789
          JWT_SECRET: ci-jwt-secret-123456789012345678901234
          DESKTOP_SESSION_SECRET: ci-desktop-session-secret-123456789012345678901234
          TOTP_ENCRYPTION_KEY: ci-totp-secret-123456789012345678901234
          REALTIME_INTERNAL_SECRET: ci-realtime-secret-123456789012345678901234
          REALTIME_ALLOWED_ORIGINS: https://remoto.test.example
          BOOTSTRAP_ADMIN_NAME: CI Admin
          BOOTSTRAP_ADMIN_EMAIL: ci-admin@example.com
          BOOTSTRAP_ADMIN_PASSWORD: ci-bootstrap-password
          RUSTDESK_RELAY_HOST: relay.remoto.test.example
        run: docker compose -f infra/docker/docker-compose.production.yml config

      - name: Dependency audit report
        run: npm audit --audit-level=high

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Inno Setup
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          if (-not ($paths | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install innosetup --no-progress -y
          }

      - name: Package agent
        run: npm run agent:package:windows

      - name: Package native operator
        run: npm run operator:package:windows

      - name: Validate Windows artifacts
        shell: powershell
        run: |
          $files = @(
            "apps/agent/release/RemotoAgent-Setup.exe",
            "apps/agent/release/RemotoAgent-Windows.zip",
            "apps/operator/release/Remoto-Operator-Setup-0.1.0.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Artefato ausente: $file" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash
            Write-Host "$hash  $file"
          }
          $manifest = Join-Path $env:RUNNER_TEMP "Remoto-Windows-SHA256SUMS.txt"
          $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash
            "$hash  $_"
          } | Set-Content -LiteralPath $manifest -Encoding ASCII
          Write-Host "Manifesto SHA256: $manifest"

      - name: Validate host diagnostics
        shell: powershell
        run: .\scripts\homologate-host.ps1 -OutputPath "$env:RUNNER_TEMP\remoto-host-report.json"

      - name: Validate agent installer scripts
        shell: powershell
        run: |
          $files = @(
            "apps/agent/scripts/install-package.ps1",
            "apps/agent/scripts/uninstall-package.ps1",
            "apps/agent/scripts/install-windows-service.ps1",
            "scripts/smoke-local.ps1",
            "infra/docker/backup-postgres.ps1",
            "infra/docker/restore-postgres.ps1"
          )
          foreach ($file in $files) {
            [scriptblock]::Create((Get-Content -LiteralPath $file -Raw)) | Out-Null
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: remoto-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/agent/release/RemotoAgent-Setup.exe
            apps/agent/release/RemotoAgent-Windows.zip
            apps/operator/release/Remoto-Operator-Setup-0.1.0.exe
            ${{ runner.temp }}/Remoto-Windows-SHA256SUMS.txt
