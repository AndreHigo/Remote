name: Remoto Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare release version
        shell: powershell
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = (Get-Content -LiteralPath "apps/operator/package.json" -Raw | ConvertFrom-Json).version
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "A versao da release precisa seguir SemVer: $version"
          }
          "REMOTO_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Versao da release: $version"

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Ensure Inno Setup
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          if (-not ($paths | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install innosetup --no-progress -y
          }

      - name: Package agent
        shell: powershell
        env:
          REMOTO_REQUIRE_BUNDLED_FFMPEG: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          REMOTO_FFMPEG_URL: ${{ vars.REMOTO_FFMPEG_URL }}
          REMOTO_FFMPEG_SHA256: ${{ vars.REMOTO_FFMPEG_SHA256 }}
        run: |
          if ($env:REMOTO_REQUIRE_BUNDLED_FFMPEG -eq "true") {
            if ([string]::IsNullOrWhiteSpace($env:REMOTO_FFMPEG_URL) -or [string]::IsNullOrWhiteSpace($env:REMOTO_FFMPEG_SHA256)) {
              throw "Release com tag exige as variaveis de repositorio REMOTO_FFMPEG_URL e REMOTO_FFMPEG_SHA256. Configure uma distribuicao validada e mantenha a licenca/origem junto dos artefatos."
            }
            $downloadPath = Join-Path $env:RUNNER_TEMP "ffmpeg.exe"
            Invoke-WebRequest -Uri $env:REMOTO_FFMPEG_URL -OutFile $downloadPath
            $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $downloadPath).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $env:REMOTO_FFMPEG_SHA256.ToLowerInvariant()) {
              throw "SHA-256 do FFmpeg nao confere. Esperado $($env:REMOTO_FFMPEG_SHA256), recebido $actualSha256."
            }
            $env:REMOTO_BUNDLE_FFMPEG_PATH = $downloadPath
          }
          npm run agent:package:windows
          $packageManifest = Get-Content -LiteralPath "apps/agent/release/RemotoAgent-Windows/RemotoAgent-package.json" -Raw | ConvertFrom-Json
          if ($env:REMOTO_REQUIRE_BUNDLED_FFMPEG -eq "true" -and $packageManifest.ffmpegBundled -ne $true) {
            throw "O manifesto do agente nao confirmou FFmpeg embutido nesta release."
          }

      - name: Package native operator
        shell: powershell
        env:
          REMOTO_OPERATOR_API_URL: ${{ secrets.REMOTO_OPERATOR_API_URL }}
          REMOTO_OPERATOR_REALTIME_URL: ${{ secrets.REMOTO_OPERATOR_REALTIME_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REMOTO_OPERATOR_API_URL) -or [string]::IsNullOrWhiteSpace($env:REMOTO_OPERATOR_REALTIME_URL)) {
            throw "Configure REMOTO_OPERATOR_API_URL e REMOTO_OPERATOR_REALTIME_URL nos secrets antes de publicar o operador."
          }
          npm run operator:package:windows

      - name: Sign Windows installers
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          SIGNING_CERT_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_B64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            throw "Configure WINDOWS_CODESIGN_PFX_B64 e WINDOWS_CODESIGN_PFX_PASSWORD antes de publicar releases."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "remoto-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_B64))
          $signtool = Get-Command signtool.exe -ErrorAction Stop
          $operatorInstaller = @(Get-ChildItem -LiteralPath "apps/operator/release" -Filter "Remoto-Operator-Setup-*.exe" -File)
          if ($operatorInstaller.Count -ne 1) { throw "Esperado um instalador do operador, encontrados $($operatorInstaller.Count)." }
          $files = @("apps/agent/release/RemotoAgent-Setup.exe", $operatorInstaller[0].FullName)
          $files += Get-ChildItem -LiteralPath "apps/agent/release/RemotoAgent-Windows" -Filter "*.exe" -Recurse | Select-Object -ExpandProperty FullName
          foreach ($file in $files) {
            & $signtool.Source sign /fd SHA256 /f $certPath /p $env:SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "Assinatura falhou: $file" }
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne "Valid") { throw "Assinatura invalida: $file ($($signature.Status))" }
          }
          Remove-Item -LiteralPath "apps/agent/release/RemotoAgent-Windows.zip" -Force
          Compress-Archive -Path "apps/agent/release/RemotoAgent-Windows/*" -DestinationPath "apps/agent/release/RemotoAgent-Windows.zip" -Force
          Remove-Item -LiteralPath $certPath -Force

      - name: Generate checksums
        shell: powershell
        run: |
          $files = @(
            "apps/agent/release/RemotoAgent-Setup.exe",
            "apps/agent/release/RemotoAgent-Windows.zip"
          )
          $operatorInstaller = @(Get-ChildItem -LiteralPath "apps/operator/release" -Filter "Remoto-Operator-Setup-*.exe" -File)
          if ($operatorInstaller.Count -ne 1) { throw "Esperado um instalador do operador, encontrados $($operatorInstaller.Count)." }
          $files += $operatorInstaller[0].FullName
          $lines = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Artefato ausente: $file" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash
            "$hash  $file"
          }
          $lines | Set-Content -LiteralPath release-manifest.txt -Encoding utf8
          Get-Content -LiteralPath release-manifest.txt

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: remoto-windows-${{ github.ref_name }}
          path: |
            apps/agent/release/RemotoAgent-Setup.exe
            apps/agent/release/RemotoAgent-Windows.zip
            apps/operator/release/Remoto-Operator-Setup-*.exe
            release-manifest.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v7
        with:
          name: remoto-windows-${{ github.ref_name }}
          path: release

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/apps/agent/release/RemotoAgent-Setup.exe \
            release/apps/agent/release/RemotoAgent-Windows.zip \
            release/apps/operator/release/Remoto-Operator-Setup-*.exe \
            release/release-manifest.txt \
            --title "Remoto $GITHUB_REF_NAME" \
            --generate-notes
