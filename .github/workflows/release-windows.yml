name: Remoto Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Inno Setup
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          if (-not ($paths | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install innosetup --no-progress -y
          }

      - name: Package agent
        run: npm run agent:package:windows

      - name: Package native operator
        run: npm run operator:package:windows

      - name: Sign Windows installers
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          SIGNING_CERT_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_B64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            throw "Configure WINDOWS_CODESIGN_PFX_B64 e WINDOWS_CODESIGN_PFX_PASSWORD antes de publicar releases."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "remoto-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_B64))
          $signtool = Get-Command signtool.exe -ErrorAction Stop
          $files = @(
            "apps/agent/release/RemotoAgent-Setup.exe",
            "apps/operator/release/Remoto-Operator-Setup-0.1.0.exe"
          )
          $files += Get-ChildItem -LiteralPath "apps/agent/release/RemotoAgent-Windows" -Filter "*.exe" -Recurse | Select-Object -ExpandProperty FullName
          foreach ($file in $files) {
            & $signtool.Source sign /fd SHA256 /f $certPath /p $env:SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) { throw "Assinatura falhou: $file" }
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne "Valid") { throw "Assinatura invalida: $file ($($signature.Status))" }
          }
          Remove-Item -LiteralPath "apps/agent/release/RemotoAgent-Windows.zip" -Force
          Compress-Archive -Path "apps/agent/release/RemotoAgent-Windows/*" -DestinationPath "apps/agent/release/RemotoAgent-Windows.zip" -Force
          Remove-Item -LiteralPath $certPath -Force

      - name: Generate checksums
        shell: powershell
        run: |
          $files = @(
            "apps/agent/release/RemotoAgent-Setup.exe",
            "apps/agent/release/RemotoAgent-Windows.zip",
            "apps/operator/release/Remoto-Operator-Setup-0.1.0.exe"
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Artefato ausente: $file" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash
            "$hash  $file"
          }
          $lines | Set-Content -LiteralPath release-manifest.txt -Encoding utf8
          Get-Content -LiteralPath release-manifest.txt

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: remoto-windows-${{ github.ref_name }}
          path: |
            apps/agent/release/RemotoAgent-Setup.exe
            apps/agent/release/RemotoAgent-Windows.zip
            apps/operator/release/Remoto-Operator-Setup-0.1.0.exe
            release-manifest.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: remoto-windows-${{ github.ref_name }}
          path: release

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/apps/agent/release/RemotoAgent-Setup.exe \
            release/apps/agent/release/RemotoAgent-Windows.zip \
            release/apps/operator/release/Remoto-Operator-Setup-0.1.0.exe \
            release/release-manifest.txt \
            --title "Remoto $GITHUB_REF_NAME" \
            --generate-notes
