name: remoto-production

services:
  postgres:
    image: postgres@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - remoto-production-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: build
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ["npx", "prisma", "migrate", "deploy", "--config", "services/api/prisma.config.ts"]
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Defina BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Defina BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:?Defina BOOTSTRAP_ADMIN_NAME}
    command: ["node", "services/api/dist/bootstrap.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      WEB_ORIGIN: https://${WEB_DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      DESKTOP_SESSION_SECRET: ${DESKTOP_SESSION_SECRET:?Defina DESKTOP_SESSION_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Defina TOTP_ENCRYPTION_KEY}
      REDIS_URL: ${REDIS_URL:?Defina REDIS_URL}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:?Defina REALTIME_INTERNAL_SECRET}
      REALTIME_CONTROL_URL: http://realtime:4200
      ENABLE_GAME_MODE: ${ENABLE_GAME_MODE:-false}
      REMOTO_AGENT_INSTALLER_PATH: ${REMOTO_AGENT_INSTALLER_PATH:-/opt/remoto/releases/RemotoAgent-Setup.exe}
      TRUST_PROXY: "true"
    volumes:
      - ./release:/opt/remoto/releases:ro
    expose:
      - "4100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4100/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_URL: /api
        VITE_REALTIME_URL: /realtime
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

  realtime:
    build:
      context: ../..
      dockerfile: infra/docker/realtime.Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REALTIME_PORT: 4200
      REALTIME_API_URL: http://api:4100
      DESKTOP_SESSION_SECRET: ${DESKTOP_SESSION_SECRET:?Defina DESKTOP_SESSION_SECRET}
      REALTIME_INTERNAL_SECRET: ${REALTIME_INTERNAL_SECRET:?Defina REALTIME_INTERNAL_SECRET}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:?Defina REALTIME_ALLOWED_ORIGINS}
      REALTIME_MAX_FRAME_BYTES: 8388608
      REALTIME_MAX_BUFFERED_BYTES: 16777216
      REALTIME_MAX_FRAME_RATE: 120
      REALTIME_MAX_FRAME_BYTES_PER_SECOND: 67108864
      REALTIME_MAX_PENDING_HANDSHAKES: 8
      REALTIME_MAX_PENDING_HANDSHAKES_TOTAL: 256
      REALTIME_TRUST_PROXY_CLIENT_IP: "true"
    expose:
      - "4200"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4200/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Defina WEB_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - remoto-production-caddy-data:/data
      - remoto-production-caddy-config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy

  rustdesk-hbbs:
    image: rustdesk/rustdesk-server@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    restart: unless-stopped
    command: hbbs -r ${RUSTDESK_RELAY_HOST:?Defina RUSTDESK_RELAY_HOST}:21117
    volumes:
      - remoto-production-rustdesk:/root
    ports:
      - "21115:21115"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - rustdesk-hbbr

  rustdesk-hbbr:
    image: rustdesk/rustdesk-server@sha256:8ecdab65deb7c84652a626380e31d11a8f1fbafd97916d57f95c20628f943c00
    restart: unless-stopped
    command: hbbr
    volumes:
      - remoto-production-rustdesk:/root
    ports:
      - "21117:21117"
      - "21119:21119"

volumes:
  remoto-production-postgres:
  remoto-production-caddy-data:
  remoto-production-caddy-config:
  remoto-production-rustdesk:
