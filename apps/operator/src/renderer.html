<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remoto | Sessao de jogo</title>
    <link rel="stylesheet" href="renderer.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">R</span><span><strong>Remoto</strong><small>Sessao de jogo</small></span></div>
        <div class="connection"><span id="status-dot" class="dot"></span><span id="status">Preparando sessao...</span></div>
        <button id="close" class="close-button" type="button">Encerrar</button>
      </header>
      <section class="stage-wrap">
        <div class="stage" id="stage">
          <video id="video" autoplay playsinline muted tabindex="0"></video>
          <div id="empty" class="empty-state">
            <div class="spinner" aria-hidden="true"></div>
            <h1 id="empty-title">Conectando ao computador</h1>
            <p id="detail">A sessao esta sendo autenticada.</p>
          </div>
          <div id="error" class="error-state" hidden></div>
        </div>
      </section>
      <footer class="footer"><span>Video H.264 por relay autenticado</span><span id="hint">Clique no video para capturar mouse e teclado</span></footer>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
